[pytest]
; Root tests/ holds the CI suite for main. pythonpath=. puts the repo root on
; sys.path so tests can `import experiments...` without living inside a package.
testpaths = tests
pythonpath = .
; tmp_path/tmpdir under the repo, never /tmp -- agent sandboxes deny it. tests/ppo is
; the only suite that uses them. pytest wipes this directory at session start; it is
; dedicated to that job, so never point it at a directory holding anything else.
addopts = --basetemp=.pytest_tmp
