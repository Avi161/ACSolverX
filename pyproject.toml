[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acx"
version = "0.1.0"
description = "Andrews-Curtis search: greedy (spec and numba), automorphisms, change of variables, hybrid, n-generator and RL methods behind one command; every path replay-verified"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
dependencies = ["numpy==2.1.3", "numba==0.63.1"]

[project.optional-dependencies]
rl = ["torch"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["acx*"]

[tool.setuptools.package-data]
acx = ["rl/checkpoint/*"]
