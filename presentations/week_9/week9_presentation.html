<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Week 9 — The AC19 cascade</title>
<!-- All slide content lives in content.js. This file only renders + styles. -->
<style>
  :root{
    --bg:#ffffff; --ink:#16181d; --muted:#6b7280; --faint:#9aa1b0;
    --accent:#4864e8; --line:#e9ebf0;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }

  #progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:300;
    background:var(--ink);transition:width .15s ease}

  #deck{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
  #deck::-webkit-scrollbar{display:none}
  .slide{height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;
    justify-content:center;padding:clamp(22px,4.4vh,56px) clamp(36px,7vw,120px);overflow:hidden}
  .slide-inner{width:100%;max-width:1240px;margin:0 auto}

  h1{font-size:clamp(30px,3.9vw,52px);line-height:1.06;margin:0;
    font-weight:250;letter-spacing:-1.2px}
  h1 strong{font-weight:650}
  h1 em{font-style:normal;color:var(--accent)}
  .hero h1{font-size:clamp(56px,9vw,130px);letter-spacing:-4px}
  .sub{font-size:clamp(14px,1.4vw,17px);color:var(--muted);margin:clamp(8px,1.5vh,14px) 0 0;
    max-width:860px;font-weight:400;line-height:1.5}

  .stats{display:flex;flex-wrap:wrap;gap:clamp(28px,4.5vw,72px);margin:clamp(14px,2.4vh,26px) 0 0}
  .stat b{display:block;font-size:clamp(26px,3vw,42px);font-weight:650;
    letter-spacing:-1px;line-height:1}
  .stat span{display:block;margin-top:7px;font-size:11.5px;color:var(--faint);
    text-transform:uppercase;letter-spacing:1.2px;font-weight:500}
  .stat.on b{color:var(--accent)}
  /* per-arm tinting inside one stat number, so "563.3 -> 263.2" carries the same
     colours as the figures: .g = length baseline (black), .h = heuristic (blue).
     Declared after .stat.on b so it wins the specificity tie. */
  .stat b i{font-style:normal;display:inline;font-size:inherit;letter-spacing:inherit;
    text-transform:none;font-weight:inherit;margin:0}
  .stat b i.g{color:var(--ink)}
  .stat b i.h{color:var(--accent)}
  .stat b i.ar{color:var(--faint);font-weight:400;padding:0 .04em}

  /* column count follows the step count (auto-flow), so a 3-step slide does not leave a
     dead fourth column; tighter gap + margin so the figures below keep the room */
  .steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
    gap:clamp(12px,1.5vw,24px);margin:clamp(14px,2.6vh,30px) 0 0}
  .step .n{font-size:13px;color:var(--faint);font-weight:500;letter-spacing:1px}
  .step .t{font-size:clamp(17px,1.8vw,23px);font-weight:600;margin:10px 0 8px;
    letter-spacing:-.3px}
  .step .d{font-size:clamp(13px,1.25vw,15px);color:var(--muted);line-height:1.55}
  .step{border-top:1px solid var(--ink);padding-top:16px}

  figure{margin:clamp(14px,2.6vh,30px) 0 0;text-align:center}
  figure img{max-width:100%;max-height:50vh;border:1px solid var(--line);
    border-radius:10px;cursor:zoom-in;background:#fff}
  .slide-inner.figonly figure{margin-top:22px}
  /* a figure that IS the slide (the 60-presentation census) gets the whole page: out of the
     1240px reading column, and as tall as a title + the slide's own padding leaves */
  .slide-inner.figonly{max-width:1900px}
  .slide-inner.figonly figure img{max-height:60vh}
  /* slides that also carry a stat row: keep figure short enough to fit 100vh.
     ">" matters — a stat row nested INSIDE a figure must not shrink its own image */
  .slide-inner:has(> .stats) figure{margin-top:22px}
  .slide-inner:has(> .stats) figure img{max-height:34vh}
  /* same reasoning for a step row: title + 3 step cards + a 64vh figure overflowed 100vh,
     and .foot is absolutely positioned, so the overflow landed as text ON the figure */
  .slide-inner:has(> .steps) figure{margin-top:26px}
  .slide-inner:has(> .steps) figure img{max-height:36vh}
  /* a sub line above the step row costs ~2vh, which is exactly the margin slide 2 had left:
     it overflowed by 7px at a 612px viewport until the figure gave that back */
  .slide-inner:has(> .steps):has(> .sub) figure{margin-top:18px}
  .slide-inner:has(> .steps):has(> .sub) figure img{max-height:34vh}

  table.tbl{margin:36px 0 0;border-collapse:collapse;font-size:clamp(13px,1.35vw,16.5px)}
  .tbl th{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:1.2px;
    font-weight:500;text-align:left;padding:0 clamp(18px,3vw,48px) 12px 0}
  .tbl td{padding:13px clamp(18px,3vw,48px) 13px 0;border-top:1px solid var(--line)}
  .tbl td:first-child{color:var(--muted)}
  .tbl tr.on td{color:var(--accent);font-weight:600}
  /* relators are case-sensitive words (x vs X = a generator vs its inverse), so they need a
     font where the two are unmistakable */
  code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:0.92em;letter-spacing:0.02em}
  .tcap{margin:18px 0 0;font-size:12.5px;color:var(--faint)}

  .figrow{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;
    margin:30px 0 0;align-items:center}
  .figrow figure{margin:0}
  .figrow figure img{max-height:44vh}
  /* a PAIR of figures is half as wide each, so the 44vh cap above leaves the column
     unfilled — give them the height back, they still clear a 100vh slide */
  .slide-inner:has(> .stats) .figrow figure img{max-height:42vh}
  /* a "wide" slide: a stat row AND the 60-bar census figure. .figonly can't serve it (it is
     keyed on having no stat row), so this is the same escape from the reading column, plus a
     lopsided pair — the census needs ~2/3 of the width for its 60 ticks to survive. */
  .slide-inner.wide{max-width:1900px}
  /* 1 : 1.77 is the two figures' own aspect ratios (1.41 and 2.50), so both fill the row to
     the same height and neither is downscaled harder than it has to be */
  .slide-inner.wide .figrow.n2{grid-template-columns:1fr 1.77fr;gap:22px}
  .slide-inner.wide:has(> .stats) .figrow figure img{max-height:40vh}
  /* three figures: narrower first column, so the two square scatters stay readable */
  .figrow.n3{grid-template-columns:0.72fr 1fr 1fr;gap:20px}
  /* a figure sharing a slide with a table gets the leftover height, not 44vh */
  .slide-inner:has(.tbl) figure{margin-top:24px}
  .slide-inner:has(.tbl) figure img{max-height:30vh}
  /* per-figure stat pair: sits above its own image, so each metric stays on its side */
  figure .stats{margin:0 0 14px;justify-content:center;text-align:left;
    gap:clamp(20px,3vw,48px)}
  .slide-inner.figonly .figrow figure{margin-top:0}
  figure .stats .stat b{font-size:clamp(22px,2.2vw,32px)}
  figcaption{margin-top:12px;font-size:12.5px;color:var(--faint)}

  /* the right bound keeps a long provenance foot from running under #counter, which sits in
     the bottom-right corner and is not in the flow */
  /* IN FLOW, not absolute. Pinned to the viewport bottom it printed straight over the
     figure on any slide whose content reached that far — five of ten did. In flow it is
     laid out after the figure, so the slide is at worst tight, never overlapped. */
  .foot{margin:20px 0 0;padding-right:clamp(70px,11vw,200px);
    font-size:11.5px;color:var(--faint);letter-spacing:.4px}
  .slide{position:relative}

  #counter{position:fixed;bottom:24px;right:clamp(36px,7vw,120px);z-index:200;
    font-size:12px;color:var(--faint);letter-spacing:1px}
  #counter b{color:var(--ink);font-weight:600}

  #dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:200;
    display:flex;flex-direction:column;gap:10px}
  #dots button{width:7px;height:7px;border-radius:50%;border:none;padding:0;
    background:#d7dae2;cursor:pointer;transition:all .2s}
  #dots button.on{background:var(--ink);transform:scale(1.4)}

  #lightbox{position:fixed;inset:0;background:rgba(255,255,255,.98);z-index:400;
    display:none;align-items:center;justify-content:center;cursor:zoom-out}
  #lightbox.open{display:flex}
  #lightbox img{max-width:94vw;max-height:94vh}

  #err{position:fixed;bottom:0;left:0;right:0;margin:0;padding:8px 14px;
    background:#fff3f3;color:#b3261e;font:12px ui-monospace,monospace;
    display:none;z-index:500;white-space:pre-wrap}

  @media (max-width:760px){
    .steps{grid-auto-flow:row;grid-template-columns:1fr 1fr}
    #dots{display:none}
  }
</style>
</head>
<body>
<div id="progress"></div>
<div id="deck"></div>
<div id="counter"></div>
<div id="dots"></div>
<div id="lightbox"><img id="lightboxImg" src="" alt=""></div>
<pre id="err"></pre>

<script src="../assets/week_9/stats.js"></script>
<script src="content.js"></script>
<script>
(function(){
  var err = document.getElementById('err');
  window.onerror = function(m){ err.style.display='block'; err.textContent = 'Error: ' + m; };
  if (typeof SLIDES === 'undefined') throw new Error('content.js did not load');

  var deck = document.getElementById('deck');

  function figsHTML(figs){
    if (!figs || !figs.length) return '';
    var html = figs.map(function(f){
      return '<figure>' + statsHTML(f.stat) +
        '<img src="'+f.img+'" alt="" loading="eager">' +
        (f.cap ? '<figcaption>'+f.cap+'</figcaption>' : '') + '</figure>';
    }).join('');
    return figs.length > 1 ? '<div class="figrow n'+figs.length+'">'+html+'</div>' : html;
  }
  function statsHTML(stats){
    if (!stats || !stats.length) return '';
    return '<div class="stats">' + stats.map(function(s){
      return '<div class="stat'+(s.on?' on':'')+'"><b>'+s.n+'</b><span>'+s.label+'</span></div>';
    }).join('') + '</div>';
  }
  function tableHTML(t){
    if (!t) return '';
    var h = '<table class="tbl"><thead><tr>' +
      t.head.map(function(c){ return '<th>'+c+'</th>'; }).join('') + '</tr></thead><tbody>';
    h += t.rows.map(function(r){
      return '<tr'+(r.on?' class="on"':'')+'>' +
        r.cells.map(function(c){ return '<td>'+c+'</td>'; }).join('') + '</tr>';
    }).join('');
    return h + '</tbody></table>' + (t.cap ? '<p class="tcap">'+t.cap+'</p>' : '');
  }
  function stepsHTML(steps){
    if (!steps || !steps.length) return '';
    return '<div class="steps">' + steps.map(function(s,i){
      return '<div class="step"><div class="n">0'+(i+1)+'</div>' +
        '<div class="t">'+s.t+'</div><div class="d">'+s.d+'</div></div>';
    }).join('') + '</div>';
  }

  SLIDES.forEach(function(s){
    var sec = document.createElement('section');
    sec.className = 'slide' + (s.hero ? ' hero' : '');
    var inner = ['<div class="slide-inner' + (s.figs && !s.stat && !s.steps ? ' figonly' : '') +
                 (s.wide ? ' wide' : '') + '">'];
    if (s.title) inner.push('<h1>'+s.title+'</h1>');
    if (s.sub) inner.push('<p class="sub">'+s.sub+'</p>');
    inner.push(statsHTML(s.stat));
    inner.push(stepsHTML(s.steps));
    inner.push(tableHTML(s.table));
    inner.push(figsHTML(s.figs));
    inner.push('</div>');
    if (s.foot) inner.push('<div class="foot">'+s.foot+'</div>');
    sec.innerHTML = inner.join('');
    deck.appendChild(sec);
  });

  var slides = Array.prototype.slice.call(deck.children);
  var counter = document.getElementById('counter');
  var dots = document.getElementById('dots');
  var progress = document.getElementById('progress');
  var cur = 0;

  slides.forEach(function(_, i){
    var b = document.createElement('button');
    b.onclick = function(){ go(i); };
    dots.appendChild(b);
  });

  function paint(){
    counter.innerHTML = '<b>'+(cur+1)+'</b> / '+slides.length;
    progress.style.width = ((cur+1)/slides.length*100) + '%';
    Array.prototype.forEach.call(dots.children, function(d,i){
      d.className = i===cur ? 'on' : '';
    });
  }
  function go(i){
    cur = Math.max(0, Math.min(slides.length-1, i));
    // instant jump: mandatory scroll-snap cancels smooth programmatic scrolls in Chrome
    deck.scrollTo({top: cur * deck.clientHeight, behavior: 'auto'});
    paint();
  }
  deck.addEventListener('scroll', function(){
    var i = Math.round(deck.scrollTop / window.innerHeight);
    if (i !== cur && i >= 0 && i < slides.length){ cur = i; paint(); }
  });
  document.addEventListener('keydown', function(e){
    if (e.key==='ArrowDown'||e.key==='PageDown'||e.key===' ') { e.preventDefault(); go(cur+1); }
    if (e.key==='ArrowUp'||e.key==='PageUp') { e.preventDefault(); go(cur-1); }
    if (e.key==='Home') go(0);
    if (e.key==='End') go(slides.length-1);
  });

  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lightboxImg');
  deck.addEventListener('click', function(e){
    if (e.target.tagName==='IMG' && e.target.closest('figure')){
      lbImg.src = e.target.src; lb.classList.add('open');
    }
  });
  lb.addEventListener('click', function(){ lb.classList.remove('open'); });

  paint();
})();
</script>
</body>
</html>
