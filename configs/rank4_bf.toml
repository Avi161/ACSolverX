# Rank-4 brute force on MS640: two added generators, every multiset of words of length 1-3, with control.
method = "rankn"
benchmark = "ms640"
workers = 4

[search]
priority = "length"
cap = 24
budget = 1000
backend = "fast"
cyclic = true

[rankn]
extra = 2
min_len = 1
max_len = 3
inverse = false
sample = 0.002
