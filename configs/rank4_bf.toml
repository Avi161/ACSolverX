# Rank-4 brute force: two added generators with relators Z1.w1, Z2.w2 for every multiset of two words of
# length 1..3 (26 words, 351 multisets per row); control and null stabilisation as in rank3_bf.toml.
# One full run is about 2.3 core-hours (224,640 searches): use --rows for a slice.
method = "rankn"
benchmark = "ms640"
workers = 4

[search]
priority = "length"
cap = 24
budget = 1000
backend = "fast"
cyclic = true

[rankn]
extra = 2
min_len = 1
max_len = 3
inverse = false
sample = 0.002
