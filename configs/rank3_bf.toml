# Rank-3 brute force: add a generator z and the relator Z.w for every freely reduced word w of length 1..4
# (one of each pair {w, w^-1}), search each start; the 2-generator control and the null stabilisation are
# searched too. Reference numbers at budget 1,000 on MS640 are in docs/RANK3.md.
# Run: python run.py --config configs/rank3_bf.toml   (or python -m acx.ngen.sweep --config ...)
# Smoke: add  --rows 0:40  (seconds).
method = "rankn"
benchmark = "ms640"
workers = 4

[search]
priority = "length"      # the only priority defined past two generators
cap = 24                 # an int, or "none" for uncapped; the cap counters record what it dropped
budget = 1000
backend = "fast"
cyclic = true

[rankn]
extra = 1                # added generators: rank = 2 + extra
min_len = 1
max_len = 4
inverse = false          # true: search w^-1 instead of w (the tie-break check)
sample = 0.002           # fraction of solved starts whose path is kept for replay
