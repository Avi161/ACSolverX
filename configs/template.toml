# Greedy search on the fast (numba) backend, run on the shipped examples; --input FILE runs your own file.
# Every key is listed: active values are the defaults (backend aside: "spec" is its default); # lines are off.

name = "template"                          # results/<name>/ (default: this file's name)
method = "greedy"                          # greedy | aut | cov | ngen | hybrid | rl | rankn (blocks below)
benchmark = "examples/presentations.txt"   # a benchmark name, or your own .txt/.csv/.jsonl file
rows = ""                                  # "" = every row; a slice "0:3" or ids "ak2,gen3"
workers = 1                                # processes; 1 runs in this process
decode = true                              # elementary length of each solve's path (needs path = true)
path = true                                # false: faster; no path, no replay; sub_moves null for greedy
# fields = ["solved", "cost", "sub_moves"] # only these record keys (id, solved, error always); absent = all

[search]
priority = "length"        # "length" (total relator length) or "s20_mk2" (two generators only)
cap = 24                   # longest relator a child may have; "none" = every child, slower (docs/CAP.md)
budget = 10000             # pops per row; a row that runs out is unsolved
backend = "fast"           # "fast" (numba) takes the same steps as "spec" (pure Python, the code default)
cyclic = true              # cyclic reduction of children
trace = false              # keep every popped state (parity tests only; memory grows)
# capture_path = true      # not written: the top-level path sets it; setting it here is an error

# Other methods: uncomment one block and set method above; a method rejects the sections it does not read.
# hybrid and rl read no [search]: comment it out for them. aut, cov, ngen and rankn read it.

# [cov]  # change of variables: the row, then its images; [search] budget is per image
# total_budget = 10000  # pops over all searches of one row
# control = true        # search the row itself first
# cap_headroom = 16     # an image's cap: its longest relator + this, if larger; "none" = the search cap
# max_len = 239         # CoV outputs longer than this are not images; "none" = no limit
# until = "solve"       # "solve" stops at the first solve; "ac_path" goes on past stable certificates

# [ngen]  # n-generator search: SAC triangulation, then lift; sac = true needs priority "length"
# sac = true  # false: search the presentation itself (an ac_path, any priority)

# [hybrid]  # cascade, then one best-first search over every rank
# budget = 1000       # work units per row
# penalty = 5         # priority letters per generator above two
# dyn_ratio = 0.5     # higher-rank pops <= dyn_ratio * rank-two pops + 20
# dyn_cap = 8         # longest relator a higher-rank product may create; "none" = uncapped
# slack = 8           # higher-rank total length ceiling above the search root
# min_uses = 2        # a defined digram must occur this often
# r2_cap = "parent"   # rank-two relator cap: "parent" (the parent's total length), an int, or "none"
# backend = "fast"    # rank-two expansion: "fast" (numba) or "spec" (pure Python)

# [rl]  # network-guided beam search; needs PyTorch (pip install -e .[rl])
# width = 1024  # beam width
# steps = 150   # beam steps
# alpha = 0.0   # weight of the value estimate in the beam score
# cap = 24      # relator cap, at most 24 (the policy's observation width)

# [rankn]  # rank-n brute-force sweep: writes its own row files, so path stays true and fields absent
# extra = 1        # generators added to the presentation (1, 2 or 3)
# min_len = 1      # shortest word w in the pool
# max_len = 4      # longest word w in the pool
# inverse = false  # also search w^-1
# sample = 0.002   # fraction of solved paths kept
