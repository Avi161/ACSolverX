name: tests

# Minimal CI gate for main: runs the root tests/ suite (pytest.ini testpaths).
# The greedy solver is numpy + numba, so those two are installed at the pins
# requirements.txt already carries (numba 0.63.1 pulls llvmlite 0.46.0, also the
# pinned one). The rest of requirements.txt is the JAX/PPO training stack, which
# no test imports -- installing it would cost minutes for nothing.
# Enable as a required status check in the main ruleset once one run exists.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    # ~2 min locally; the first call into each @njit function compiles it, and a
    # hosted runner is slower than a laptop, so leave headroom above that.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest + the solver's runtime deps
        run: python -m pip install --upgrade pip pytest numpy==2.1.3 numba==0.63.1

      - name: Run tests
        run: pytest
