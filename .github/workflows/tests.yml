name: tests

# The default selection (pytest.ini: -m "not slow") plus the smoke run. `pytest -m ""` locally runs
# the slow parity and census checks as well.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUMBA_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e .[dev]
      - run: pytest -q
      - run: python run.py --config configs/smoke.toml --out /tmp/results

  rl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUMBA_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e .[dev]
      - name: Install the optional CPU policy runtime
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check the policy, PPO, runner and adversarial regressions
        run: pytest -q tests/test_rl.py tests/test_runner.py tests/test_review_regressions.py
