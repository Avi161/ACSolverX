name: tests

# Minimal CI gate for main: runs the root tests/ suite (pytest.ini testpaths).
# The greedy solver is numpy + numba, so those two are installed at the pins
# requirements.txt already carries (numba 0.63.1 pulls llvmlite 0.46.0, also the
# pinned one). The rest of requirements.txt is the JAX/PPO training stack, which
# no test imports -- installing it would cost minutes for nothing.
# Enable as a required status check in the main ruleset once one run exists.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    # ~2 min locally; the first call into each @njit function compiles it, and a
    # hosted runner is slower than a laptop, so leave headroom above that.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest + the solver's runtime deps
        run: python -m pip install --upgrade pip pytest numpy==2.1.3 numba==0.63.1

      - name: Run tests
        run: pytest

  tests-ppo:
    # experiments/ppo/ is a pure-torch package; tests/ppo/ skips itself when torch is
    # absent, which is why the `tests` job above stays numpy+numba. This job is what
    # actually runs it. numba is here for the two shaping tests, which import the
    # heuristic reference (experiments/search/heuristics.py) and through it the njit
    # solver -- only the few functions phi touches pay a compile. CPU wheels only --
    # the suite runs one real PPO update and a few beams, so the timeout carries
    # headroom; if it ever times out, split the job rather than trimming tests.
    # Enable as a required status check alongside `tests` once one run exists.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-torch.txt

      - name: Install pytest + CPU torch
        # Two steps on purpose: on Linux, PyPI's default torch wheel IS the CUDA build
        # (~6 GB of nvidia deps), and with --extra-index-url pip still prefers it. Only
        # --index-url on the torch line itself forces the CPU wheel.
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install numpy==2.1.3 numba==0.63.1
          python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu

      - name: Run the PPO suite
        run: pytest tests/ppo
