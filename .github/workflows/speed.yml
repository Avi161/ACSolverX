name: speed

# Times every pipeline (each config, with paths and with path = false) on the base commit and on this one, in turn on
# one runner (benchmark/speed.py), and fails when one takes more than 15% longer than on the base. Four jobs run in
# parallel, a few minutes each.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: speed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group:
          - greedy s20_mk2 ladder spec
          - aut cov ngen_sac
          - hybrid rl
          - rank3 rank4 rank5
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ./head[dev]
      - if: contains(matrix.group, 'rl')
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python head/benchmark/speed.py base head --only ${{ matrix.group }} --summary "$GITHUB_STEP_SUMMARY"
