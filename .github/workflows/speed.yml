name: speed

# Times every pipeline (each config, with paths and with path = false) on the base commit and on this one, in turn on
# one runner (benchmark/speed.py), and fails when one takes more than 2% longer than on the base, timed nine more times
# first to rule out noise. Four jobs run in parallel, a few minutes each; on a pull request, the report job then
# comments one table of how much faster or slower each pipeline is (and edits that comment on every push).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: speed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group:
          - greedy s20_mk2 ladder spec
          - aut cov ngen_sac
          - hybrid rl
          - rank3 rank4 rank5
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ./head[dev]
      - if: contains(matrix.group, 'rl')
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          python head/benchmark/speed.py base head --only ${{ matrix.group }} --summary "$GITHUB_STEP_SUMMARY"
          --json speed.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-${{ strategy.job-index }}
          path: speed.json
          if-no-files-found: ignore

  report:
    needs: speed
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: speed-*
          path: timings
      - run: python3 benchmark/speed.py --report timings/*/speed.json | tee comment.md >> "$GITHUB_STEP_SUMMARY"
      - continue-on-error: true                  # a fork's token cannot comment; the run summary has the table
        run: gh pr comment "$PR" --edit-last --create-if-none --body-file comment.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
